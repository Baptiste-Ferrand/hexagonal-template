name: Template Docker Ci 

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - develop
      - 'feat/*'  
jobs:
  versioning:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write 
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toml
        run: |
          python -m pip install toml

      - name: Get the actual version from pyproject.yml
        id: get_version
        run: |
          VERSION=$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Increment version according to PR source branch
        id: increment_version
        run: |
          VERSION=${{ env.VERSION }}
          BRANCH_NAME="${GITHUB_HEAD_REF}" 

          case $BRANCH_NAME in
            feat/*)
              VERSION=$(echo $VERSION | awk -F. -v OFS=. '{$2++; $3=0; print $0}')  
              ;;
            fix/*)
              VERSION=$(echo $VERSION | awk -F. -v OFS=. '{$3++; print $0}') 
              ;;
            *"breaking change"*)
              VERSION=$(echo $VERSION | awk -F. -v OFS=. '{$1++; $2=0; $3=0; print $0}')  
              ;;
            *)
              echo "No change to version"
              ;;
          esac

          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update version in pyproject.toml
        id: version
        run: |
          python -c "import toml; data = toml.load('pyproject.toml'); data['project']['version'] = '${{ env.VERSION }}'; toml.dump(data, open('pyproject.toml', 'w'))"
          echo "version=${{ env.VERSION }}" >> $GITHUB_OUTPUT

      - name: Commit and push the updated pyproject.toml
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          git add pyproject.toml
          
          git commit -m "Update version to ${{ steps.increment_version.outputs.version }}"
          
          git push origin ${{ github.ref }}

  setup-docker-tag:
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Defining the Docker tag according to the destination branch
        id: set-tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "tag=pre-prod" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

  build-and-deploy-image:
    needs: [versioning, setup-docker-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify version
        run: |
          echo "Version: ${{ needs.versioning.outputs.version }}"

      - name: Validate the generated tag
        run: |
          TAG="${{ needs.setup-docker-tag.outputs.docker_tag }}"
          if [[ ! "$TAG" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo "Invalid tag format: $TAG"
            exit 1
          fi

      - name: Connect to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Activate Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: |
            ghcr.io/Baptiste-Ferrand/hexagonal-template:${{ needs.versioning.outputs.version }}
            ghcr.io/Baptiste-Ferrand/hexagonal-template:latest
            ghcr.io/Baptiste-Ferrand/hexagonal-template:${{ needs.setup-docker-tag.outputs.docker_tag }}


